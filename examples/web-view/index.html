<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 外壳即拖动区（桥正常注入，.drag-region 可拖窗口）；内部按钮不受影响 -->
  <div class="shell drag-region">
    <header class="appbar">
      <span class="dot" id="status-dot"></span>
      <h1 data-i18n="title">…</h1>
      <button class="icon-btn" id="btn-refresh" data-i18n-title="btnRefresh">
        <svg width="13" height="13" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M36.728 36.728A17.943 17.943 0 0 1 24 42c-9.941 0-18-8.059-18-18S14.059 6 24 6c4.97 0 9.47 2.015 12.728 5.272C38.386 12.93 42 17 42 17"/><path d="M42 8v9h-9"/></svg>
      </button>
    </header>
    <!-- 未配置站点地址时的引导态 -->
    <div class="empty" id="empty" hidden>
      <svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M6 24h36M24 6c5 4.5 7.5 10.8 7.5 18s-2.5 13.5-7.5 18c-5-4.5-7.5-10.8-7.5-18S19 10.5 24 6Z"/></svg>
      <p data-i18n="emptyHint"></p>
    </div>
    <!-- 站点区 = 目标页面（cookie 与 WebView2 用户数据目录同罐，登录一次持久化） -->
    <iframe id="frame" hidden></iframe>
  </div>
  <script src="main.js"></script>
</body>
</html>
