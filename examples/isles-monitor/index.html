<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
<style>
  .card {
    flex-direction: row;
    align-items: center;
    gap: clamp(10px, min(4cqw, 8cqh), 24px);
  }
  .card.dir-right { flex-direction: row-reverse; }

  /* ── 环区：贴内容左缘不动；右半指标块居中（辅助线对位） ── */
  .rings {
    position: relative;
    flex: none;
    width: min(100cqh, 156px);
    height: min(100cqh, 156px);
  }
  /* 环与 M 档同尺寸——min(内容高, 156px)（P 档恰为 156px，M 档钉到同值） */
  .rings svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke-width: 6; }
  .ring-val { fill: none; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
  /* 弧色跟槽位；轨道 = 槽位色 16% 混入卡底色 */
  .slot-outer { stroke: var(--ring-outer, #12B886); }
  .slot-mid { stroke: var(--ring-mid, #3B82F6); }
  .slot-inner { stroke: var(--ring-inner, #F26D5B); }
  .track-outer { stroke: color-mix(in srgb, var(--ring-outer, #12B886) 16%, var(--isles-card-bg)); }
  .track-mid { stroke: color-mix(in srgb, var(--ring-mid, #3B82F6) 16%, var(--isles-card-bg)); }
  .track-inner { stroke: color-mix(in srgb, var(--ring-inner, #F26D5B) 16%, var(--isles-card-bg)); }

  /* ── 右区：系统整体占用热力图（纯图无文字；每格 = 30s 均值、按列推进、
     最新在右下；环看分项占比、热力图看整体走势） ── */
  .side {
    flex: 1;
    min-width: 0;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #heat {
    display: grid;
    grid-template-rows: repeat(7, 14px);
    grid-auto-flow: column;
    gap: 4px;
    justify-content: center;
    transform: translateX(-0.5cqw);   /* 整体左移 0.5cqw（≈420 宽下 2px，随卡面缩放等比跟随） */
  }
  .heat-cell { width: 14px; height: 14px; border-radius: 3px; }

  /* 方向镜像（环在右）：以环左为基准的真镜像——位移取反（0.5cqw 向右）、
     时间轴翻转（列推进从右到左，最新格落左下） */
  .card.dir-right #heat {
    transform: translateX(0.5cqw);
    direction: rtl;
  }

  /* ── 布局断档：≤240px 宽 = M 小方（纯环无文字） ──
     纪律：容器查询的规则不能样式化查询容器自身（会被静默丢弃）——居中靠
     子元素 margin-inline: auto（横向）+ 顶层 align-items: center（纵向） */
  @container (max-width: 240px) {
    .rings { margin-inline: auto; }
    .side { display: none; }
  }
</style>
</head>
<body>
  <div class="isles-card drag-region card" id="card">
    <div class="rings" id="rings">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <g id="ring-svg"></g>
      </svg>
    </div>
    <div class="side" id="side">
      <div id="heat"></div>
    </div>
  </div>
  <script src="base.js"></script>
  <script src="main.js"></script>
</body>
</html>
