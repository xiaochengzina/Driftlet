<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
<style>
  .card {
    align-items: center;
    justify-content: center;
    /* 刻度深浅按卡面主色派生（自定义属性继承声明处计算值的经典坑） */
    --isles-fg-2: color-mix(in srgb, var(--isles-fg) 62%, transparent);
    --isles-fg-3: color-mix(in srgb, var(--isles-fg) 45%, transparent);
  }

  /* ── 表盘：viewBox 120 与族圆环同一坐标系；铺满内容盒随窗等比。
     极简圆点盘——无盘面圈、无刻度线，12 枚圆点作时刻（整点加大加深） ── */
  .dial { width: 100%; height: 100%; display: block; }
  .dot { fill: var(--isles-fg-3); }
  .dot-major { fill: var(--isles-fg-2); }

  /* 指针：胶囊形——头尾同款半圆帽；同色 1.2px 描边圆接头软化；
     绕盘心旋转（transform-origin + JS 每帧只改角度） */
  .hand {
    fill: var(--isles-fg);
    stroke: var(--isles-fg);
    stroke-width: 1.2;
    stroke-linejoin: round;
    transform-origin: 60px 60px;
  }
  /* 秒针 = 全卡唯一 accent 元素：细针一根（无配重），中心轴帽收尾 */
  #hand-s {
    stroke: var(--isles-accent);
    stroke-width: 1.3;
    stroke-linecap: round;
    transform-origin: 60px 60px;
  }
  .pin { fill: var(--isles-accent); }
</style>
</head>
<body>
  <div class="isles-card isles-card--s drag-region card" id="card">
    <svg class="dial" viewBox="0 0 120 120" role="img" id="dial" aria-label="">
      <g id="dots"></g>
      <!-- 胶囊针（12 点位为基准形，JS 旋转）：头尾同款半圆帽——两端一致的
           圆润语言；时针宽 3.5 尖 r31 / 尾至 66、分针宽 2.5 尖 r42 / 尾至 67，
           秒针 r43（与圆点刻度 r50 留呼吸距） -->
      <path class="hand hand-h" id="hand-h" d="M 58.25 64.25 L 58.25 30.5 A 1.75 1.75 0 0 1 61.75 30.5 L 61.75 64.25 A 1.75 1.75 0 0 1 58.25 64.25 Z" />
      <path class="hand hand-m" id="hand-m" d="M 58.75 65.75 L 58.75 19.75 A 1.25 1.25 0 0 1 61.25 19.75 L 61.25 65.75 A 1.25 1.25 0 0 1 58.75 65.75 Z" />
      <line id="hand-s" x1="60" y1="68" x2="60" y2="17" />
      <circle class="pin" cx="60" cy="60" r="2.8" />
    </svg>
  </div>
  <script src="base.js"></script>
  <script src="main.js"></script>
</body>
</html>
