<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="base.css" />
<style>
  .card {
    align-items: center;
    justify-content: center;
    /* 文字深浅副色按卡面主色重新派生（自定义属性继承声明处计算值的经典坑） */
    --isles-fg-2: color-mix(in srgb, var(--isles-fg) 62%, transparent);
    --isles-fg-3: color-mix(in srgb, var(--isles-fg) 45%, transparent);
  }

  /* ── 环区：与 isles-monitor 同款圆环——r50/线宽 6/圆头/-90° 起笔，
     轨道 = accent 16% 混入卡底色；M-only 皮肤，环铺满内容盒随窗等比。
     纪律：选择器必须钉直接子代（.ring > svg）——写成 .ring svg 会把
     rotate/满幅殃及环内步进钮的图标（减号被转成竖条的事故） ── */
  .ring {
    position: relative;
    flex: none;
    width: 100%;
    height: 100%;
  }
  .ring > svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
  .ring-track {
    fill: none;
    stroke-width: 6;
    stroke: color-mix(in srgb, var(--isles-accent) 16%, var(--isles-card-bg));
  }
  .ring-val {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke: var(--isles-accent);
    transition: stroke-dashoffset 0.6s ease, opacity 0.25s ease;
  }
  .card.paused .ring-val { opacity: 0.45; }

  /* ── 环心：+ / 时间 / − / 状态 竖栈（居中） ── */
  .mtime-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 4cqh, 20px);   /* ± 钮与时间拉开间距 */
    pointer-events: none;   /* 环心穿透给拖动区；步进钮单独恢复 */
  }
  .mtime {
    font-size: clamp(18px, min(19cqw, 22cqh), 60px);
    font-weight: 500;   /* 小档数字加重（倒数日实机教训：小字号 400 偏单薄） */
    line-height: 1.05;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: var(--isles-fg);
    transition: color 0.3s ease;
  }
  .mtime.long { font-size: clamp(13px, min(11cqw, 13cqh), 40px); }   /* H:MM:SS 小时态降字级 */
  .card.done .mtime { color: var(--isles-accent); }
  .mstate {
    font-size: clamp(10px, min(5.6cqw, 8cqh), 18px);
    letter-spacing: 0.08em;
    color: var(--isles-fg-2);
    transition: color 0.3s ease;
  }
  .mstate:empty { display: none; }   /* 就绪态无文案——± 步进器已说明一切 */

  /* ── 环内步进器：仅倒计时·就绪态参与布局；悬停卡面才显形（与工具区同律）。
     圆角方块 + accent 浅染（chip 语系），两钮同色相；与时间拉开间距 ── */
  .step-btn {
    display: none;
    pointer-events: auto;
    width: clamp(18px, min(14cqw, 16cqh), 38px);
    height: clamp(18px, min(14cqw, 16cqh), 38px);
    border-radius: 30%;
    background: color-mix(in srgb, var(--isles-accent) 12%, var(--isles-card-bg));
    color: var(--isles-accent);
    opacity: 0;
    /* 不用 visibility:hidden——隐藏态元素不进 Tab 序，键盘永远够不到
       （审查应修）；pointer-events 挡误点、opacity 留可聚焦性 */
    pointer-events: none;
    transition: opacity 0.18s ease, background 0.15s ease, transform 0.12s ease;
  }
  .step-btn:hover {
    background: color-mix(in srgb, var(--isles-accent) 22%, var(--isles-card-bg));
    color: var(--isles-accent);
  }
  .card.mode-down.idle .step-btn { display: grid; }
  .card.mode-down.idle:hover .step-btn, .card.mode-down.idle:focus-within .step-btn { opacity: 1; pointer-events: auto; }
  .card.mode-down.idle:hover .step-btn[disabled], .card.mode-down.idle:focus-within .step-btn[disabled] { opacity: 0.35; cursor: default; }

  /* 到时脉动（满环 + 时间——done 态环回满可见，脉动才有效）；系统「减弱动画」开启时不动 */
  @media (prefers-reduced-motion: no-preference) {
    .card.done .mtime,
    .card.done .ring-val { animation: timer-done-pulse 1.1s ease-in-out infinite; }
  }
  @keyframes timer-done-pulse { 50% { opacity: 0.3; } }

  /* 右上 hover 工具区（button 不受桥拖动接管影响；pointer-events 挡误点、
     opacity 留键盘可聚焦性——visibility:hidden 会把它们移出 Tab 序） */
  .tools {
    position: absolute;
    top: clamp(8px, min(4cqw, 8cqh), 16px);
    right: clamp(8px, min(4cqw, 8cqh), 16px);
    display: flex;
    gap: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease;
    z-index: 4;
  }
  .card:hover .tools, .card:focus-within .tools { opacity: 1; pointer-events: auto; }
  /* 开始/暂停单按钮双态：双图标同格叠放，opacity + scale 交叉淡入
     （display 硬切无过渡，读着像坏了；transition 可中断，连点也顺滑） */
  #btn-toggle svg {
    grid-area: 1 / 1;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  #btn-toggle .icon-pause { opacity: 0; transform: scale(0.8); }
  .card.running #btn-toggle .icon-play { opacity: 0; transform: scale(0.8); }
  .card.running #btn-toggle .icon-pause { opacity: 1; transform: none; }
</style>
</head>
<body>
  <div class="isles-card isles-card--s drag-region card mode-down idle" id="card">
    <div class="tools">
      <button type="button" class="isles-toolbtn" id="btn-toggle">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
      </button>
      <button type="button" class="isles-toolbtn" id="btn-reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
    </div>
    <div class="ring" id="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="50" />
        <circle class="ring-val" id="ring-val" cx="60" cy="60" r="50" />
      </svg>
      <div class="mtime-wrap">
        <button type="button" class="isles-toolbtn step-btn" id="btn-up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <div class="mtime" id="mtime"></div>
        <button type="button" class="isles-toolbtn step-btn" id="btn-down">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <div class="mstate" id="mstate"></div>
      </div>
    </div>
  </div>
  <script src="base.js"></script>
  <script src="main.js"></script>
</body>
</html>
