[package]
name = "pack-skin"
version = "0.1.0"
edition = "2021"
description = "Driftlet 皮肤打包工具：把皮肤文件夹打成 .dskin"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 显式启用 flate2 的 rust_backend：zip 的 deflate-flate2 只声明依赖、不选压缩后端
flate2 = { version = "1", features = ["rust_backend"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
