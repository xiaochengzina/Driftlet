[package]
name = "driftlet"
version = "1.0.2"
edition = "2021"

[lib]
name = "driftlet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
sysinfo = "0.32"
notify = "8"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
winreg = "0.55"
wasapi = "0.15"
rustfft = "6"
windows = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Storage_Xps",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "UI_Notifications",
  "Data_Xml_Dom",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_Globalization"
] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Vendored tray-icon with a patched Windows RGBA->HICON path:
# upstream passes a 1-byte-per-pixel buffer where CreateIcon expects a 1bpp
# AND mask, producing icons whose mask is garbage (fine via DrawIconEx, but
# striped garbage in mask-aware consumers — Task Manager's process icon when
# no window is visible, and the tray drag image). The vendored copy builds a
# proper mask + 32bpp DIB via CreateIconIndirect. See
# vendor/tray-icon/src/platform_impl/windows/icon.rs (NOTE(driftlet)).
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
