[package]
name = "driftlet"
version = "1.2.2"
edition = "2021"

[lib]
name = "driftlet_lib"
# 纯 Windows 桌面应用：模板自带的 staticlib/cdylib 是给 iOS/Android 用的，
# 本项目不做移动端。只留 lib（rlib——main.rs 与测试用）：cdylib 每次构建
# 都会让 MSVC 链接器打印「正在创建库 .dll.lib/.exp」，新版 rustc 的
# linker_messages lint 把它报成 warning（噪音，且多一步无用链接）。
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 全目标统一嵌 comctl32 v6 清单（build.rs；tauri-build 的 bins 内嵌已关，见 build.rs）
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
sysinfo = "0.32"
notify = "8"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"
# skin:// 协议路径解码（wry 递交的 URI 保留百分号编码，中文 entry/资源名需先解码）
percent-encoding = "2"
# 启动更新检测：阻塞式 HTTPS 调 GitHub releases API（rustls = 全平台自包含，
# 不依赖系统 OpenSSL）；调用走 spawn_blocking，不进主线程
ureq = { version = "2", default-features = false, features = ["tls"] }
# 安装包下载时记 SHA-256、「立即安装」执行前复核（防可信动作执行被改写
# 的安装包——更新目录曾可被 file_system 皮肤改写，审查 H2）
sha2 = "0.10"
# 皮肤预览图降采样（capture.rs）：管理器皮肤卡片显示高度仅 112px，全尺寸
# 截图解码后 ~8MB/张驻留渲染进程内存——落盘前把最大边压到 640px。只要
# PNG 编解码（CapturePreview 产物恒为 PNG），关掉默认特性不背其他编解码器
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
winreg = "0.55"
wasapi = "0.15"
rustfft = "6"
windows = { version = "0.61", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_LibraryLoader",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Storage_Xps",
  "Win32_System_Performance",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_Security",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "UI_Notifications",
  "Data_Xml_Dom",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_Globalization",
  "Win32_Foundation"
] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

# Vendored tray-icon with a patched Windows RGBA->HICON path:
# upstream passes a 1-byte-per-pixel buffer where CreateIcon expects a 1bpp
# AND mask, producing icons whose mask is garbage (fine via DrawIconEx, but
# striped garbage in mask-aware consumers — Task Manager's process icon when
# no window is visible, and the tray drag image). The vendored copy builds a
# proper mask + 32bpp DIB via CreateIconIndirect. See
# vendor/tray-icon/src/platform_impl/windows/icon.rs (NOTE(driftlet)).
# Second patch in the same crate: the TaskbarCreated handler uses a quiet
# NIM_DELETE variant — after an explorer restart the old icon is already
# gone, so upstream's unconditional eprintln printed a bogus "Error removing
# system tray icon" on every restart. See mod.rs (NOTE(driftlet)).
#
# Vendored tauri-runtime-wry with a patched WindowMessage::Destroy handler:
# when a window's HWND was already destroyed externally (wallpaper-layer skin
# SetParent'ed into Progman, killed together with explorer), tao never fires
# WindowEvent::Destroyed, so the window/webview entries leak in every tauri
# registry and the label stays taken forever ("already exists" on recreate).
# The patch detects the dead handle and runs the full Destroyed flow. See
# vendor/tauri-runtime-wry/src/lib.rs (NOTE(driftlet)).
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }
