name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest # build.rs 要嵌 Windows 清单资源，必须 Windows runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Frontend build
        run: npm ci && npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
