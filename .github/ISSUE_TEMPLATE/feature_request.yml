name: 💡 功能建议 / Feature Request
description: 建议新功能或改进 / Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      description: 描述场景与痛点（好的需求从场景出发，不从方案出发）
      placeholder: 例：我有 12 张皮肤，每次游戏开播都要逐张隐藏……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的形态 / Proposed solution
      description: 你设想的交互/行为；皮肤开发接口需求请给出调用场景
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代 / Alternatives considered
      description: 包括「现在用现有功能怎么绕」
  - type: checkbox
    id: skin-api
    attributes:
      label: 这与皮肤开发接口（桥/命令/权限）相关 / This concerns the skin API (bridge/commands/permissions)
